# ===========================================
# TaskFlow Docker Compose Configuration
# ===========================================
# Development environment with hot reload
# Run: docker-compose up -d
# ===========================================

version: '3.8'

services:
  # -----------------------------------------
  # MongoDB Database
  # -----------------------------------------
  mongodb:
    image: mongo:7
    container_name: taskflow-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-taskflow}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - taskflow-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # -----------------------------------------
  # MongoDB Compass (Web GUI)
  # -----------------------------------------
  compass:
    image: mongo-express:1.0.2
    container_name: taskflow-compass
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${COMPASS_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${COMPASS_PASSWORD:-admin123}
    ports:
      - "${COMPASS_PORT:-8081}:8081"
    networks:
      - taskflow-network
    depends_on:
      mongodb:
        condition: service_healthy

  # -----------------------------------------
  # Backend API (Express + TypeScript)
  # -----------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    container_name: taskflow-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-password123}@mongodb:27017/${MONGO_DATABASE:-taskflow}?authSource=admin
      LOG_LEVEL: debug
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      # Bind mount for hot reload
      - ./backend/src:/app/src:ro
      - ./backend/package.json:/app/package.json:ro
      # Exclude node_modules from bind mount
      - backend_node_modules:/app/node_modules
    networks:
      - taskflow-network
    depends_on:
      mongodb:
        condition: service_healthy

  # -----------------------------------------
  # Frontend (React + Vite)
  # -----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    container_name: taskflow-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      # Bind mount for hot reload
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      # Exclude node_modules from bind mount
      - frontend_node_modules:/app/node_modules
    networks:
      - taskflow-network
    depends_on:
      - backend

# -----------------------------------------
# Networks
# -----------------------------------------
networks:
  taskflow-network:
    driver: bridge
    name: taskflow-network

# -----------------------------------------
# Volumes
# -----------------------------------------
volumes:
  mongodb_data:
    name: taskflow-mongodb-data
  backend_node_modules:
    name: taskflow-backend-modules
  frontend_node_modules:
    name: taskflow-frontend-modules
