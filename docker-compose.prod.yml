# ===========================================
# TaskFlow Docker Compose - Production
# ===========================================
# Production environment with optimized builds
# Run: docker-compose -f docker-compose.prod.yml up -d
# ===========================================

version: '3.8'

services:
  # -----------------------------------------
  # MongoDB Database
  # -----------------------------------------
  mongodb:
    image: mongo:7
    container_name: taskflow-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongodb_data_prod:/data/db
    networks:
      - taskflow-network-prod
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # -----------------------------------------
  # Backend API (Production Build)
  # -----------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: production
    container_name: taskflow-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
      LOG_LEVEL: info
    expose:
      - "3000"
    networks:
      - taskflow-network-prod
    depends_on:
      mongodb:
        condition: service_healthy

  # -----------------------------------------
  # Frontend (Nginx with Production Build)
  # -----------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: production
    container_name: taskflow-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - taskflow-network-prod
    depends_on:
      - backend

# -----------------------------------------
# Networks
# -----------------------------------------
networks:
  taskflow-network-prod:
    driver: bridge
    name: taskflow-network-prod

# -----------------------------------------
# Volumes
# -----------------------------------------
volumes:
  mongodb_data_prod:
    name: taskflow-mongodb-data-prod
